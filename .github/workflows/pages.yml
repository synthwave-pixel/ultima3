# Redeploys the latest release to GitHub Pages, for when a release's own deploy failed (a GitHub hiccup) or the site
# needs putting back. A release deploys the site itself, in the same run as the apps (desktop.yml), so this is only
# ever a retry: it takes no commit or branch, and builds the newest full release's tag, never anything unreleased.
# Started by hand: Actions > Redeploy the latest release > Run workflow.
# The site is served at https://<owner>.github.io/ultima3/, so Vite is told to prefix asset URLs with /ultima3/. The
# site also serves that release's Flatpak as a signed repository under /flatpak/ (see desktop/flatpak-repo.sh).
name: Redeploy the latest release

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, shared with a release's: neither stops the other half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # The newest full release (pre-releases are skipped): its tag is what gets built.
      - id: latest
        working-directory: ${{ github.workspace }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.latest.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build's mark: the commit built.
      - run: VITE_BUILD="$(git rev-parse --short=7 HEAD)" npm run build
        env:
          VITE_BASE: /ultima3/
      # The Flatpak repository: the same release's bundle, downloaded, imported into a fresh OSTree repository and
      # signed. flatpak and ostree come from the cache kept per runner image, else the mirror
      # (.github/actions/apt-install).
      - timeout-minutes: 20
        uses: ./.github/actions/apt-install
        with:
          packages: flatpak ostree
      - run: bash desktop/flatpak-repo.sh "$GITHUB_WORKSPACE/web/dist/flatpak"
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SITE: https://synthwave-pixel.github.io/ultima3
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
