# Builds the browser port in web/ and publishes it to GitHub Pages.
# The site is served at https://<owner>.github.io/ultima3/, so Vite is told
# to prefix asset URLs with /ultima3/.
name: Deploy to GitHub Pages

# Only main publishes (the github-pages environment rejects other
# branches), and the concurrency group cancels an older run, so a run for
# any other branch would only cancel a real deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: VITE_BUILD="${GITHUB_SHA::7}" npm run build
        env:
          VITE_BASE: /ultima3/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
