# Builds the browser port in web/ and publishes it to GitHub Pages with
# each release: the release workflow (desktop.yml) starts it once a
# release is published, naming the commit released, so the site runs the
# release's game as the apps do. Started by hand (Actions > Deploy to
# GitHub Pages > Run workflow) it deploys the release branch, or the
# commit or branch given.
# The site is served at https://<owner>.github.io/ultima3/, so Vite is told
# to prefix asset URLs with /ultima3/. The site also serves the newest
# release's Flatpak as a signed repository under /flatpak/ (see
# desktop/flatpak-repo.sh), brought up to date by the deploy that follows
# each release.
name: Deploy to GitHub Pages

# The workflow runs on main (the github-pages environment accepts no other
# branch, and the concurrency group would let a run elsewhere cancel a real
# deploy) and builds the commit asked for. A push to main deploys nothing.
on:
  workflow_dispatch:
    inputs:
      source:
        description: The commit or branch to build and deploy
        type: string
        default: release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || 'release' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # The build's mark: the commit built, not main's, where the workflow runs.
      - run: VITE_BUILD="$(git rev-parse --short=7 HEAD)" npm run build
        env:
          VITE_BASE: /ultima3/
      # The Flatpak repository: the newest release's bundle, imported into a fresh OSTree repository and signed. A
      # pruned repository holds one commit anyway, so nothing needs keeping between deploys. flatpak and ostree come from
      # the cache kept per runner image, else the mirror, its stale package lists (a superseded version 404s) refreshed
      # first (.github/actions/apt-install).
      - timeout-minutes: 20
        uses: ./.github/actions/apt-install
        with:
          packages: flatpak ostree
      - run: bash desktop/flatpak-repo.sh "$GITHUB_WORKSPACE/web/dist/flatpak"
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SITE: https://synthwave-pixel.github.io/ultima3
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
