# Builds the desktop app (desktop/, Electron) for Windows, macOS and Linux
# and the Android app (mobile/, Capacitor), as the Ultima V port's do. It
# runs for releases and on demand, never for a push to main: main gets the
# checks alone (ci.yml), which every run here also passes first.
# A push to the release branch (git push origin main:release) is a
# release, to every platform at once: the apps and the web game are all
# built first, then the builds are published as a GitHub Release and the
# site is deployed, in this one run, so a failure anywhere stops it before
# anything reaches a player. (pages.yml only redeploys the latest release.)
# A run started by hand (Actions > Desktop and Android builds > Run
# workflow) does what "kind" says: dev-builds (the default) keeps the
# builds as workflow artifacts, to try a change, with nothing published
# (and a signed Mac app not notarized); prerelease publishes a GitHub
# pre-release, for testers (the updater and the update notice look only at
# the latest full release, so nothing updates to it, and the site is not
# deployed); release is a release, as a push to the release branch is.
# With "android_only" on, only the APK is built, and there is no release.
# The version is the major.minor from desktop/package.json with this
# workflow's run number as the patch (1.0.37, say), decided by
# desktop/version.cjs. A push to main no longer runs it, so a release's
# number is the last run's plus one (dev builds count too); a new series
# starts by changing that major.minor. Keep the builds in this workflow:
# another would count from 1. A release's notes are the root README's
# changelog section headed with its version ("### v1.0.37, <date>"),
# through desktop/release-notes.cjs, above GitHub's generated compare
# link. A release carries what the desktop apps' updater reads beside the
# builds (latest*.yml, the blockmaps, the Mac .zip; desktop/updates.cjs).
# The Mac app is signed with the Developer ID certificate, and a published
# one notarized, where the repository has the MACOS_* and APPLE_* secrets
# (desktop/macSigning.cjs); without them it is signed ad hoc, and only
# tells of a newer release rather than installing it. The Windows builds
# are unsigned: see the README's Desktop section for what that means on
# each platform. The APK is signed with the committed sideload key unless
# the ANDROID_KEYSTORE_* secrets provide a release key. Linux gets a
# Flatpak bundle as well as an AppImage; the Linux job installs (and
# caches) the runtimes it needs.
name: Desktop and Android builds

run-name: ${{ github.event_name == 'push' && 'Release' || inputs.android_only && 'Android dev build' || inputs.kind == 'dev-builds' && 'Dev builds' || inputs.kind == 'prerelease' && 'Pre-release' || 'Release' }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: dev-builds keeps the builds as artifacts; prerelease publishes for testers; release publishes for everyone
        type: choice
        options: [dev-builds, prerelease, release]
        default: dev-builds
      android_only:
        description: Build only the Android app (no desktop builds, so no release)
        type: boolean
        default: false
  # No paths filter: GitHub skips a filtered workflow when a push creates the branch, which is how a release starts.
  push:
    branches: [release]

permissions:
  contents: write

# Whether this run publishes (a release or a pre-release): its Mac app is then notarized and checked.
env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.kind == 'release' || inputs.kind == 'prerelease' }}

jobs:
  # The checks main gets (ci.yml), first: nothing is built from a commit that fails them.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    if: ${{ !inputs.android_only }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            args: --linux AppImage flatpak
          - os: windows-latest
            target: win
            args: --win
          - os: macos-latest
            target: mac
            args: --mac
    runs-on: ${{ matrix.os }}
    # A build takes under ten minutes; anything near this is a runner stuck, better failed than left waiting.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      # The Flatpak needs flatpak-builder and the Freedesktop runtime, SDK and Electron base app: about a gigabyte, so
      # the user installation is cached between runs and the install is a no-op when the cache is warm.
      - if: matrix.target == 'linux'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-25.08-${{ runner.os }}
      # flatpak-builder and what it builds with (its recommended tools named, the runner's own as it happens), and the
      # helpers flatpak runs as it installs: from the cache kept per runner image, else the mirror with retries
      # (.github/actions/apt-install), the step itself limited.
      - if: matrix.target == 'linux'
        timeout-minutes: 20
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            flatpak flatpak-builder elfutils binutils git patch unzip xz-utils zstd
            desktop-file-utils gtk-update-icon-cache hicolor-icon-theme shared-mime-info
      - if: matrix.target == 'linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm run bundle
        working-directory: desktop
      - run: npm run dist -- ${{ matrix.args }}
        working-directory: desktop
        env:
          # No identity looked for in the runner's keychain: the Mac build names its own (desktop/macSigning.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # The Mac build signed with the Developer ID certificate, from the repository's secrets; without them it is
          # signed ad hoc, as before. Given to the Mac build alone: electron-builder would take a CSC_LINK for Windows
          # signing too.
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_SIGNING_IDENTITY: ${{ matrix.target == 'mac' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          # Notarized only when published, which is what players and testers download: a few minutes more a build.
          APPLE_ID: ${{ matrix.target == 'mac' && env.PUBLISH == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && env.PUBLISH == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && env.PUBLISH == 'true' && secrets.APPLE_TEAM_ID || '' }}
      # A published Mac app must be notarized: electron-builder only warns when it cannot notarize (an Apple secret
      # missing), and Gatekeeper would then refuse the download. Builds without the certificate (signed ad hoc, as this
      # repository's are until the secrets are added) are not checked.
      - if: matrix.target == 'mac' && env.PUBLISH == 'true'
        run: |
          if [ "$SIGNED" != true ]; then echo 'Not signed: no certificate.'; exit 0; fi
          for app in dist/mac*/*.app; do spctl --assess --type execute -vv "$app"; done
        working-directory: desktop
        env:
          SIGNED: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      # The app as packaged, launched: it must start and run the game (smoke-built.cjs), or nothing is published.
      - if: matrix.target == 'linux'
        run: xvfb-run -a node smoke-built.cjs
        working-directory: desktop
        env:
          ELECTRON_NO_SANDBOX: 1
      - if: matrix.target != 'linux'
        run: node smoke-built.cjs
        working-directory: desktop
      # A failed smoke test keeps what the window showed, to see why.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.target }}
          path: desktop/dist/smoke-built.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: ultima3-${{ matrix.target }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.flatpak
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  android:
    needs: checks
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: mobile
      - run: npm run bundle
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      # A release key from the repository secrets, when there is one; otherwise Gradle falls back to the sideload key.
      - if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - run: npm run apk
        working-directory: mobile
      - uses: actions/upload-artifact@v7
        with:
          name: ultima3-android
          path: mobile/dist/*.apk
          if-no-files-found: error


  # The site, for a release (not a pre-release, nor dev builds): the web game built from this commit, and the Flatpak
  # repository it serves made from this run's own Flatpak, all before anything is published, so a failure here stops
  # the release whole and the site is always the release's game, as the apps are.
  site:
    if: ${{ github.event_name == 'push' || inputs.kind == 'release' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build's mark: the commit built.
      - run: VITE_BUILD="$(git rev-parse --short=7 HEAD)" npm run build
        env:
          VITE_BASE: /ultima3/
      # The Flatpak repository: this run's own bundle, imported into a fresh OSTree repository and signed. A pruned
      # repository holds one commit anyway, so nothing needs keeping between deploys. flatpak and ostree come from the
      # cache kept per runner image, else the mirror (.github/actions/apt-install).
      - uses: actions/download-artifact@v8
        with:
          name: ultima3-linux
          path: linux
      - timeout-minutes: 20
        uses: ./.github/actions/apt-install
        with:
          packages: flatpak ostree
      - run: bash desktop/flatpak-repo.sh "$GITHUB_WORKSPACE/web/dist/flatpak" "$(ls "$GITHUB_WORKSPACE"/linux/*.flatpak | head -1)"
        working-directory: ${{ github.workspace }}
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SITE: https://synthwave-pixel.github.io/ultima3
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # A push to the release branch, or a manual run of kind release or prerelease, publishes one release with every file
  # once all four builds (and, for a release, the site) exist; the tag lands on this commit. Dev builds stop at their
  # artifacts. A pre-release has no site, so a skipped one is no reason to stop.
  release:
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.android.result == 'success'
      && (needs.site.result == 'success' || needs.site.result == 'skipped')
      && (github.event_name == 'push' || inputs.kind == 'release' || inputs.kind == 'prerelease') }}
    needs: [build, android, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(node desktop/version.cjs)" >> "$GITHUB_OUTPUT"
      # The apps' builds only: not the site's artifact (github-pages), nor a smoke screenshot from a failed attempt.
      - uses: actions/download-artifact@v8
        with:
          path: files
          pattern: ultima3-*
          merge-multiple: true
      - run: ls -la files
      # The notes are the README changelog's section for this version (desktop/release-notes.cjs), above GitHub's
      # generated compare link; without a section the release still goes out, with a warning and the link alone.
      - run: |
          node desktop/release-notes.cjs "$VERSION" > notes.md
          notes=()
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else echo "::warning::README.md has no changelog section for v$VERSION"; fi
          if [ "$PRERELEASE" = true ]; then notes+=(--prerelease); fi
          gh release create "v$VERSION" files/* --title "v$VERSION" --generate-notes "${notes[@]}" --target "$GITHUB_SHA"
        env:
          PRERELEASE: ${{ inputs.kind == 'prerelease' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}

  # The site, deployed once the release is out: the build the site job made from this commit. Not for a pre-release.
  deploy:
    needs: [release, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
